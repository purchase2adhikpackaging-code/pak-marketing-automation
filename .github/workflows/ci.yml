name: CI

on:
  pull_request:
  push:
    branches:
      - feat/**
      - fix/**

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AI_TEXT_PROVIDER: fake
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Focused blueprint tests
        continue-on-error: true
        run: npx vitest run tests/vitest/publishing-factory/blueprint.test.ts

      - name: Focused knowledge-selection tests
        continue-on-error: true
        run: npx vitest run tests/vitest/publishing-factory/knowledge-selection.test.ts

      - name: Focused manuscript-domain tests
        continue-on-error: true
        run: npx vitest run tests/vitest/publishing-factory/manuscript-domain.test.ts

      - name: Focused manuscript-writer tests
        continue-on-error: true
        run: npx vitest run tests/vitest/publishing-factory/manuscript-writer.test.ts

      - name: Focused manuscript-serializer tests
        continue-on-error: true
        run: npx vitest run tests/vitest/publishing-factory/manuscript-serializer.test.ts

      - name: Focused checkpoint-store tests
        continue-on-error: true
        run: npx vitest run tests/vitest/publishing-factory/checkpoint-store.test.ts

      - name: Focused worker-queue tests
        continue-on-error: true
        run: npx vitest run tests/vitest/publishing-factory/worker-queue.test.ts

      - name: Unit tests diagnostic report
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=vitest-report.json

      - name: Upload unit test diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-${{ github.sha }}
          path: vitest-report.json
          if-no-files-found: error

      - name: Unit tests
        run: npm run test:run

      - name: Publishing registry smoke test
        run: npm run publishing:registry

      - name: Canonical knowledge validation
        run: npm run publishing:knowledge-validate

      - name: Canonical knowledge lock audit
        run: npm run publishing:knowledge-list

      - name: Publishing deterministic QA fixture
        run: npm run publishing:qa-fixture

      - name: Build
        run: npm run build

      - name: E2E smoke test
        run: npm run test:e2e
