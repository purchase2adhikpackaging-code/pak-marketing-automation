name: Certificate Master Sync

on:
  push:
    branches:
      - docs/master-sync-certificates-v020
    paths:
      - .github/workflows/certificate-master-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: docs/master-sync-certificates-v020
          fetch-depth: 0

      - name: Run deterministic master sync
        run: python .github/scripts/certificate_master_sync.py

      - name: Commit synchronized master
        run: |
          git diff --stat
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/academic/PAK_ACADEMIC_CURRICULUM_STUDY_MATERIAL_BLUEPRINT_PRD.md docs/academic/ACADEMIC_INDEX.md
          git commit -m "docs: synchronize certificate architectures into master PRD v0.2.0"
          git push origin HEAD:docs/master-sync-certificates-v020
