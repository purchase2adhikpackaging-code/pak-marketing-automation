name: Temporary Academic Export

on:
  push:
    branches:
      - docs/certificate-master-sync-v0.2.0

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload academic workspace
        uses: actions/upload-artifact@v4
        with:
          name: academic-export
          path: docs/academic
          if-no-files-found: error
          retention-days: 1
